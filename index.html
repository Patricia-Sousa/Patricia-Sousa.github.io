<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patrícia Sousa | Portefólio</title>

    <meta
      name="description"
      content="Portefólio profissional de Patrícia Sousa — Desenvolvimento Web, Programação, Sistemas de Informação, Bases de Dados e Redes."
    />

    <link rel="stylesheet" href="style.css" />
    <script src="terminal.js" defer></script>
  </head>

  <body>
    <main class="terminal-page">
      <section
        class="terminal-window"
        aria-label="Entrada interativa do portefólio"
      >
        <div class="terminal-header">
          <span class="terminal-title">Terminal</span>

          <button
            type="button"
            class="terminal-close"
            id="terminal-close"
            aria-label="Fechar janela do terminal"
          >
            ×
          </button>
        </div>

        <div class="terminal-body">
          <pre id="terminal-output" aria-live="polite"></pre>
          <span class="cursor" aria-hidden="true"></span>
        </div>

        <nav class="terminal-actions" id="terminal-actions">
          <a href="portfolio.html" class="terminal-button">Entrar no Portefólio</a>
        </nav>

        <noscript>
          <p class="noscript-message">
            JavaScript está desativado. Pode aceder diretamente ao portefólio
            através do menu.
          </p>
          <a href="portfolio.html" class="terminal-button">Entrar no Portefólio</a>
        </noscript>
        </section>
      </section>

      <section class="terminal-reload-area" id="terminal-reload-area">
        <p>O terminal foi encerrado.</p>

        <button
            type="button"
            class="terminal-reload-button"
            id="terminal-reload-button">
            Reabrir Terminal
        </button>
    </section>
    </main>
  </body>
</html>
